<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-Paper-Scissors</title>
</head>
<body>
    <p>Rock paper Scissors</p>
    <button onclick="
        playGame('rock');
    ">Rock</button>

    <button onclick="
        playGame('paper');

    "> Paper</button>

    <button onclick="
        playGame('Scissors');
        
    ">Scissors</button>

    <button onclick="
        score.win = 0 ;
        score.lose = 0 ;
        score.tie = 0 ;
    ">Reset Score</button>

  

    <script>
        // let computerMove ='';

        // we will use return statement instead of this
        // we will create another function and use parameter to avoid same code for all. 
        //we will a variable for win , lose , tie 

        const score = {
            win : 0,
            lose : 0,
            tie : 0 
        }

        function playGame(playerMove) {
            const computerMove = pickComputerMove();
            let result = '';

            if (playerMove === 'Scissors'){
                 if (computerMove === 'Rock') {
                    result = 'You lose.'
                } else if (computerMove === 'Paper') {
                    result = 'You win.';
                } else if (computerMove === 'Scissors') {
                    result ='Tie.';
                }

            } else if (playerMove === 'paper'){
                
                if (computerMove === 'Rock') {
                    result = 'You win.'
                } else if (computerMove === 'Paper') {
                    result = 'Tie.';
                } else if (computerMove === 'Scissors') {
                    result ='You lose.';
                }

            }  else if (playerMove === 'rock'){
                if (computerMove === 'Rock') {
                    result = 'Tie.'
                } else if (computerMove === 'Paper') {
                    result = 'You lose.';
                } else if (computerMove === 'Scissors') {
                    result ='You win.';
                }
            }   
            
            if (result === 'You win.') {
                score.win += 1 ;
            }else if (result === 'You lose.') {
                score.lose += 1 ;
            }else if (result === 'Tie.') {
                score.tie += 1 ;
            }

            alert(`You picked ${playerMove}. Computer Move is ${computerMove}. ${result}
Wins : ${score.win} , Losses : ${score.lose} , Tie : ${score.tie}`);
        }

        function pickComputerMove() {

        const RandomNumber = Math.random();

        let computerMove ='';
        
        if (RandomNumber >=0 && RandomNumber <= 1/3) {
        computerMove ='Rock';
        } else if (RandomNumber >=1/3 && RandomNumber < 2/3){
        computerMove ='Paper';
        } else if (RandomNumber >=2/3 && RandomNumber < 1){
         computerMove = 'Scissors';
        }
        return computerMove ;
        }
    </script>
    
</body>
</html>
